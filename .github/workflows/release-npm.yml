# PREVIEW (not active until the owner adds the NPM_TOKEN repository secret and approves CI publishing).
# Manual release: builds, tests, writes a CycloneDX SBOM and publishes to npm WITH provenance
# (a signed statement, shown on npmjs.com, that this exact package was built from this repo and commit by GitHub Actions).
name: Release to npm (with provenance)

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # required for npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm
                  cache-dependency-path: mcp/package-lock.json
            - run: npm ci --ignore-scripts
              working-directory: mcp
            - run: npm run build
              working-directory: mcp
            - run: npm test
              working-directory: mcp
            - name: SBOM (CycloneDX)
              working-directory: mcp
              run: npm sbom --omit dev --sbom-format cyclonedx > sbom.cdx.json
            - uses: actions/upload-artifact@v4
              with:
                  name: sbom
                  path: mcp/sbom.cdx.json
            - name: Publish with provenance
              working-directory: mcp
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
