# Hard-fail mechanical review gates. Local tools only: no Semgrep App, no PR review bots.
name: Mechanical gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ccp-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-gates.txt
      - name: ccp-checker
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: semgrep scan --metrics=off --disable-version-check --config semgrep --error --quiet --no-git-ignore src

  clang-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run clang-static

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sanitizers

  unused-symbol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run unused-symbol
